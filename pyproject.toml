[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitalforge"
version = "3.0.0"
description = "Autonomous, self-reviewing AI/robotics/data/satellite research software factory for GitHub Actions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OrbitalForge contributors"}]
dependencies = [
  "openai>=3.13,<4",
  "PyYAML>=6.0,<7",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "networkx>=3.3,<4",
  "astropy>=6.1,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=5,<8",
  "pytest-socket>=0.7,<1",
  "ruff>=0.16.7,<1",
]

[project.scripts]
orbitalforge = "orbitalforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
