version: 4
schedule_minutes: 30

# Quality-first defaults. Repository variables can override the model/reasoning fields.
worker_model: openai/gpt-oss-120b
reviewer_model: qwen/qwen3.8-27b
planner_model: qwen/qwen3.8-27b
fallback_model: ""
worker_reasoning_effort: high
recovery_reasoning_effort: high
reviewer_reasoning_effort: high
planner_reasoning_effort: high

# Bounded generation/context budgets. The worker emits complete replacement files, so output needs
# enough room for real code while still preventing runaway generations.
max_output_tokens: 1800
reviewer_max_output_tokens: 900
planner_max_output_tokens: 1400
max_context_chars: 6500
max_context_files: 6
max_context_file_chars: 2500
max_audit_context_chars: 9000
max_audit_context_files: 8
max_diff_chars_for_review: 4500
max_operations_per_tick: 4
max_file_bytes: 60000
max_total_write_bytes: 120000
quality_timeout_seconds: 240
coverage_min_percent: 80
min_final_tests: 4
min_final_readme_chars: 1200
max_api_attempts: 1
max_task_attempts_before_recovery: 5

allowed_extensions:
  - .py
  - .md
  - .json
  - .yaml
  - .yml
  - .toml
  - .txt
  - .csv
  - .gitignore

forbidden_names:
  - .env
  - secrets
  - credentials
  - id_rsa
  - id_ed25519
  - private_key
  - token

allowed_python_packages:
  - numpy
  - scipy
  - sklearn
  - pandas
  - matplotlib
  - networkx
  - astropy
  - pytest
  - pytest-cov
  - pytest-socket
  - ruff

denied_python_imports:
  - socket
  - os
  - requests
  - httpx
  - aiohttp
  - paramiko
  - ftplib
  - telnetlib
  - webbrowser
  - subprocess
  - urllib
  - http
  - smtplib
  - imaplib
  - poplib
  - xmlrpc
  - pty
  - ctypes
  - importlib

project_policy:
  required_domains:
    - AI/ML
    - robotics
    - data processing
    - satellite systems
  simulation_only: true
  no_physical_actuation: true
  no_weaponization: true
  no_credentials: true
  no_external_network_required_for_tests: true
  deterministic_tests: true
  synthetic_data_by_default: true
  no_fabricated_results: true
