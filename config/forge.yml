version: 4
schedule_minutes: 60

worker_model: qwen/qwen3.8-27b
reviewer_model: qwen/qwen3.8-27b
planner_model: qwen/qwen3.8-27b
fallback_model: ""

worker_reasoning_effort: none
recovery_reasoning_effort: none
reviewer_reasoning_effort: none
planner_reasoning_effort: none

# This account has returned an effective 1000 output-token/minute limit in real runs.
# Keep single-call output below that ceiling; llm.py also spaces consecutive model calls.
max_output_tokens: 900
reviewer_max_output_tokens: 300
planner_max_output_tokens: 900

max_context_chars: 4500
max_context_files: 4
max_context_file_chars: 1800
max_audit_context_chars: 9000
max_audit_context_files: 8
max_diff_chars_for_review: 4500

# Two operations are enough for a compact source + matching test pair.
max_operations_per_tick: 2
max_file_bytes: 60000
max_total_write_bytes: 120000

quality_timeout_seconds: 240
coverage_min_percent: 80
min_final_tests: 4
min_final_readme_chars: 1200

# One strict-schema call plus one JSON-object fallback already gives two chances per attempt.
# Two attempts remain bounded by the workflow timeout because llm.py rate-spaces every request.
max_api_attempts: 2
max_task_attempts_before_recovery: 5

allowed_extensions:
  - .py
  - .md
  - .json
  - .yaml
  - .yml
  - .toml
  - .txt
  - .csv
  - .gitignore

forbidden_names:
  - .env
  - secrets
  - credentials
  - id_rsa
  - id_ed25519
  - private_key
  - token

allowed_python_packages:
  - numpy
  - scipy
  - sklearn
  - pandas
  - matplotlib
  - networkx
  - astropy
  - pytest
  - pytest-cov
  - pytest-socket
  - ruff

denied_python_imports:
  - socket
  - os
  - requests
  - httpx
  - aiohttp
  - paramiko
  - ftplib
  - telnetlib
  - webbrowser
  - subprocess
  - urllib
  - http
  - smtplib
  - imaplib
  - poplib
  - xmlrpc
  - pty
  - ctypes
  - importlib

project_policy:
  required_domains:
    - AI/ML
    - robotics
    - data processing
    - satellite systems
  simulation_only: true
  no_physical_actuation: true
  no_weaponization: true
  no_credentials: true
  no_external_network_required_for_tests: true
  deterministic_tests: true
  synthetic_data_by_default: true
  no_fabricated_results: true
